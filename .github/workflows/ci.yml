name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The declared support floor and the current release: the floor is
        # tested so "3.10+" stays a fact rather than an aspiration.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate canonical data
        run: python -m retroformats validate
      - name: Rebuild dist and require no drift
        run: python -m retroformats build --check
      - name: Run tests
        run: python -m unittest discover -t . -s tests -v

  # The duel-engine tests (tests/engine) run for real here. The job above skips
  # them by design - the main suite is standard-library-only and downloads
  # nothing - so this job is the only place they execute. Every input is taken
  # at the revision data/sources.json records and verified; ocgcore is compiled
  # from the pinned source rather than downloaded as a binary (see
  # docs/engine-testing.md, "Pinned inputs"). `run` fails the job if any engine
  # test skips, fails, or if fewer than the required number execute.
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Fetch pinned engine inputs and build ocgcore from the pinned source
        run: python scripts/engine_env.py prepare --dest "$RUNNER_TEMP/engine"
      - name: Run engine tests (a skip fails the job)
        run: python scripts/engine_env.py run --dest "$RUNNER_TEMP/engine" --expect-at-least 56
